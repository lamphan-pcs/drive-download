<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive Link Converter</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Google Drive Link to Direct Link Converter</h1>
        
        <div class="input-section">
            <label for="links-input">Paste Google Drive links (one per line):</label>
            <textarea id="links-input" rows="10" placeholder="Paste your Google Drive links here, one per line..."></textarea>
            
            <div class="button-group">
                <button id="convert-btn" onclick="convertLinks()">Convert Links</button>
                <button id="clear-btn" onclick="clearAll()">Clear All Links</button>
                <button id="download-btn" onclick="downloadResults()" disabled>Download Results</button>
            </div>
            
            <div class="options">
                <label>
                    <input type="checkbox" id="verify-links"> Verify links (slower but more accurate)
                </label>
            </div>
        </div>
        
        <div id="results-section" class="results-section" style="display: none;">
            <h2>Conversion Results</h2>
            <div id="summary"></div>
            <div id="results-container"></div>
        </div>
    </div>
    
    <script src="js/utils.js"></script>
    <script src="js/converter.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
